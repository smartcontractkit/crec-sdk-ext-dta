name: watcher-artifacts

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    # WASM output depends on the Go host platform (GOHOSTOS/GOHOSTARCH).
    # Developers build on macOS; use the same host here so local rebuilds match CI.
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure git line endings
        run: |
          git config core.autocrlf false
          git config core.eol lf

      - name: Install Go from go.dev
        run: |
          set -euo pipefail
          GO_VERSION=$(grep '^go ' go.mod | awk '{print $2}')
          ARCH=$(uname -m)
          case "$ARCH" in
            arm64) GO_ARCH=arm64 ;;
            x86_64) GO_ARCH=amd64 ;;
            *) echo "Unsupported macOS arch: $ARCH" >&2; exit 1 ;;
          esac
          GO_TARBALL="go${GO_VERSION}.darwin-${GO_ARCH}.tar.gz"
          GO_BASE="https://dl.google.com/go"
          curl -fsSL "${GO_BASE}/${GO_TARBALL}" -o "${GO_TARBALL}"
          curl -fsSL "${GO_BASE}/${GO_TARBALL}.sha256" -o "${GO_TARBALL}.sha256"
          EXPECTED_SHA=$(tr -d '[:space:]' < "${GO_TARBALL}.sha256")
          ACTUAL_SHA=$(shasum -a 256 "${GO_TARBALL}" | awk '{print $1}')
          if [ "$EXPECTED_SHA" != "$ACTUAL_SHA" ]; then
            echo "❌ Go tarball checksum mismatch"
            exit 1
          fi
          sudo rm -rf /usr/local/go
          sudo tar -C /usr/local -xzf "${GO_TARBALL}"
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"
          echo "GOROOT=/usr/local/go" >> "$GITHUB_ENV"
          echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"

      - name: Verify Go toolchain
        run: |
          set -euo pipefail
          go version
          which go
          EXPECTED=$(grep '^go ' go.mod | awk '{print $2}')
          ACTUAL=$(go version | awk '{print $3}' | sed 's/go//')
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "❌ Go version mismatch: expected $EXPECTED, actual $ACTUAL"
            exit 1
          fi

      - name: Install Task
        run: sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin

      - name: Install bc and brotli 1.2.0
        run: |
          set -euo pipefail
          brew install bc brotli
          if ! brotli --version 2>&1 | grep -q "1.2.0"; then
            echo "❌ Expected brotli 1.2.0, got: $(brotli --version 2>&1)"
            exit 1
          fi

      - name: Build watcher WASM
        run: |
          set -euo pipefail
          go clean -cache
          go mod download
          task watcher:build --force

      - name: Verify committed WASM matches build
        run: task watcher:verify

      - name: Check WASM and config sizes
        run: task watcher:check:sizes:all
