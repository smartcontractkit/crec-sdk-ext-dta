version: "3"

# =============================================================================
# CREC SDK Extension: DTA - Taskfile
# =============================================================================
# Code generation, testing, and watcher workflow management tasks.

silent: true

tasks:
  default:
    desc: "List all available tasks"
    cmds:
      - task --list

  # -------------------------------------------------------------
  # ---------------- SDK Development Tasks ----------------------
  # -------------------------------------------------------------

  test:
    desc: "Run all tests"
    cmds:
      - go test ./...

  tools:
    desc: "Install required build tools"
    cmds:
      - echo "📦 Installing build tools..."
      - brew install brotli
      - echo "✅ Tools installed"

  deps:
    desc: "Update dependencies"
    cmds:
      - echo "📦 Updating deps..."
      - go mod tidy
      - go mod download
      - echo "✅ Dependencies updated"

  vendor:
    desc: "Update vendor directory"
    cmds:
      - echo "📦 Updating vendor directory..."
      - go mod tidy
      - go mod download
      - go mod vendor
      - echo "✅ Vendor directory updated"

  # -------------------------------------------------------------
  # ---------------- Code Generation Tasks ----------------------
  # -------------------------------------------------------------

  generate:
    desc: "Generate all code (bindings, operations, event types)"
    cmds:
      - task: generate:bindings
      - task: generate:sdk
      - echo "✅ All DTA SDK code generation complete"

  generate:bindings:
    desc: "Generate Go bindings from ABIs"
    cmds:
      - echo "🔧 Generating Go bindings..."
      - mkdir -p v1/bindings/dtarm v1/bindings/dtars
      - abigen --abi v1/watcher/bundle/DTARequestManagementU.abi.json --pkg dtarm --out v1/bindings/dtarm/dtarm.gen.go
      - abigen --abi v1/watcher/bundle/DTARequestSettlementU.abi.json --pkg dtars --out v1/bindings/dtars/dtars.gen.go
      - echo "✅ Bindings generated"
    sources:
      - v1/watcher/bundle/*.abi.json
    generates:
      - v1/bindings/dtarm/dtarm.gen.go
      - v1/bindings/dtars/dtars.gen.go

  generate:sdk:
    desc: "Generate DTA SDK operations, event types, schemas, and decoders from ABIs"
    dir: v1
    cmds:
      - echo "🔧 Generating SDK operations, events, schemas, and decoders..."
      - go run ./gen/main.go ./gen/config.go
      - echo "✅ Operations, events, and decoders generated"
    sources:
      - gen/main.go
      - gen/config.go
      - watcher/bundle/*.abi.json
    generates:
      - abi_gen.go
      - extension_gen.go
      - operations_gen.go
      - operations_helpers_gen.go
      - events_gen.go
      - decode_gen.go
      - watcher/bundle/params_schema_gen.go

  # -------------------------------------------------------------
  # ---------------- Watcher Bundle Tasks ----------------------
  # -------------------------------------------------------------

  watcher:build:one:
    desc: "Build one DTA watcher (set VERSION=v1 or v2)"
    vars:
      VERSION: '{{ .VERSION | default "v1" }}'
    cmds:
      - echo "🔧 Building {{ .VERSION }} watcher WASM..."
      - cd {{ .VERSION }}/watcher && make build
      - echo "✅ {{ .VERSION }} watcher bundle built"
    sources:
      - "{{ .VERSION }}/watcher/**/*.go"
      - "{{ .VERSION }}/watcher/handler/**/*.go"
      - "{{ .VERSION }}/watcher/bundle/*.abi.json"
      - "{{ .VERSION }}/watcher/bundle/config.tmpl"
    generates:
      - "{{ .VERSION }}/watcher/wasm/workflow.wasm"
      - "{{ .VERSION }}/watcher/bundle/binary.wasm"
      - "{{ .VERSION }}/watcher/bundle/binary.wasm.br.b64"

  watcher:build:
    desc: "Build all DTA watcher versions (v1, v2)"
    cmds:
      - task: watcher:build:one
        vars:
          VERSION: v1
      - task: watcher:build:one
        vars:
          VERSION: v2

  watcher:build:v1:
    desc: "Build v1 DTA watcher WASM only"
    cmds:
      - task: watcher:build:one
        vars:
          VERSION: v1

  watcher:build:v2:
    desc: "Build v2 DTA watcher WASM only"
    cmds:
      - task: watcher:build:one
        vars:
          VERSION: v2

  watcher:check:sizes:
    desc: "Check WASM binary and config sizes against CRE limits"

    vars:
      VERSION: '{{ .VERSION | default "v1" }}'
      WASM_LIMIT_MB: 100
      WASM_COMPRESSED_LIMIT_MB: 20
      CONFIG_LIMIT_KB: 50
    cmds:
      - |
        WASM="{{ .VERSION }}/watcher/bundle/binary.wasm"
        if [ ! -f "$WASM" ]; then
          echo "❌ WASM not found at $WASM — run 'task watcher:build' first"
          exit 1
        fi

        WASM_BYTES=$(wc -c < "$WASM" | tr -d ' ')
        WASM_MB=$(echo "scale=2; $WASM_BYTES / 1048576" | bc)
        echo "WASM binary:       ${WASM_MB} MB  (limit: {{ .WASM_LIMIT_MB }} MB)"
        if [ "$(echo "$WASM_MB > {{ .WASM_LIMIT_MB }}" | bc)" -eq 1 ]; then
          echo "❌ WASM uncompressed exceeds limit"
          exit 1
        fi

        COMPRESSED=$(mktemp)
        brotli -c "$WASM" > "$COMPRESSED" 2>/dev/null
        if [ $? -eq 0 ]; then
          COMP_BYTES=$(wc -c < "$COMPRESSED" | tr -d ' ')
          COMP_MB=$(echo "scale=2; $COMP_BYTES / 1048576" | bc)
          echo "WASM compressed:   ${COMP_MB} MB  (limit: {{ .WASM_COMPRESSED_LIMIT_MB }} MB)"
          if [ "$(echo "$COMP_MB > {{ .WASM_COMPRESSED_LIMIT_MB }}" | bc)" -eq 1 ]; then
            rm -f "$COMPRESSED"
            echo "❌ WASM compressed exceeds limit"
            exit 1
          fi
        else
          echo "⚠️  brotli not found — skipping compressed size check"
        fi
        rm -f "$COMPRESSED"

        CONFIG_BYTES=0
        for abi in {{ .VERSION }}/watcher/bundle/*.abi.json; do
          if [ -f "$abi" ]; then
            SIZE=$(wc -c < "$abi" | tr -d ' ')
            CONFIG_BYTES=$((CONFIG_BYTES + SIZE))
            echo "  ABI $(basename $abi): ${SIZE} bytes"
          fi
        done
        CONFIG_BYTES=$((CONFIG_BYTES + 500))
        CONFIG_KB=$(echo "scale=2; $CONFIG_BYTES / 1024" | bc)
        echo "Config estimate:   ${CONFIG_KB} KB  (limit: {{ .CONFIG_LIMIT_KB }} KB)"
        if [ "$(echo "$CONFIG_KB > {{ .CONFIG_LIMIT_KB }}" | bc)" -eq 1 ]; then
          echo "❌ Config estimate exceeds limit"
          exit 1
        fi

        echo "✅ All sizes within CRE limits"

  watcher:check:sizes:all:
    desc: "Check WASM/config sizes for all supported versions (v1, v2)"
    cmds:
      - task: watcher:check:sizes
        vars:
          VERSION: v1
      - task: watcher:check:sizes
        vars:
          VERSION: v2

  # -------------------------------------------------------------
  # ---------------- Watcher Workflow Tasks ---------------------
  # -------------------------------------------------------------
  # All watcher tasks accept VERSION var (default: v1)
  # Usage: task watcher:simulate VERSION=v2 TX_HASH=0x...

  watcher:config:
    desc: "Render watcher config.yaml and workflow.yaml via gomplate"

    vars:
      VERSION: '{{ .VERSION | default "v1" }}'
      VALUES_FILE: '{{ .VALUES_FILE | default "values/values.yaml" }}'
      WF_NAME_OVERRIDE: '{{ .WF_NAME_OVERRIDE | default "" }}'
    cmds:
      - |
        VALUES_PATH="{{ .VERSION }}/watcher/{{ .VALUES_FILE }}"
        if [ ! -f "$VALUES_PATH" ]; then
          echo "❌ values file not found: $VALUES_PATH"
          exit 1
        fi

        export WF_NAME_OVERRIDE="{{ .WF_NAME_OVERRIDE }}"

        if [ -f "{{ .VERSION }}/watcher/bundle/config.tmpl" ]; then
          gomplate \
            -d "config=$VALUES_PATH" \
            -f {{ .VERSION }}/watcher/bundle/config.tmpl \
            -o {{ .VERSION }}/watcher/config.yaml
          echo "✅ config.yaml generated"
        fi

        if [ -f "{{ .VERSION }}/watcher/workflow.tmpl" ]; then
          gomplate \
            -d "config=$VALUES_PATH" \
            -f {{ .VERSION }}/watcher/workflow.tmpl \
            -o {{ .VERSION }}/watcher/workflow.yaml
          echo "✅ workflow.yaml generated"
        fi

  watcher:simulate:
    # Example Usage:
    # task watcher:simulate VERSION=v1 TX_HASH=0x4b6d4a1f62f1938c91f5aa18b6546261810c6b19201fda5239fab0ed4420e2ed EVENT_INDEX=0 TRIGGER_INDEX=0
    desc: "Simulate watcher workflow with CRE CLI"

    deps: [mock:start]
    vars:
      VERSION: '{{ .VERSION | default "v1" }}'
      TARGET: '{{ .TARGET | default "local-simulation" }}'
      TX_HASH: '{{ .TX_HASH }}'
      EVENT_INDEX: '{{ .EVENT_INDEX | default "0" }}'
      TRIGGER_INDEX: '{{ .TRIGGER_INDEX | default "0" }}'
    cmds:
      - |
        if [ -z "{{ .TX_HASH }}" ]; then
          echo "❌ TX_HASH required. Usage: task watcher:simulate VERSION=v1 TX_HASH=0x..."
          exit 1
        fi
        cd {{ .VERSION }}/watcher && \
        cre workflow simulate watcher-dta-{{ .VERSION }} \
          --target {{ .TARGET }} \
          --evm-tx-hash {{ .TX_HASH }} \
          --evm-event-index {{ .EVENT_INDEX }} \
          --non-interactive \
          --trigger-index {{ .TRIGGER_INDEX }}


  watcher:deploy:
    desc: "Deploy watcher workflow to CRE"

    deps: [watcher:check:cre-api-key]
    vars:
      VERSION: '{{ .VERSION | default "v1" }}'
      CRE_TARGET: '{{ .CRE_TARGET | default "staging" }}'
      OWNER_LABEL: '{{ .OWNER_LABEL | default "crec-sdk-ext-dta" }}'
    cmds:
      - |
        cd {{ .VERSION }}/watcher && \
        cre workflow deploy watcher --target {{ .CRE_TARGET }} --owner-label {{ .OWNER_LABEL }} --yes

  watcher:release:
    desc: "Config and deploy watcher to CRE"

    vars:
      VERSION: '{{ .VERSION | default "v1" }}'
      VALUES_FILE: '{{ .VALUES_FILE | default "values/values.yaml" }}'
      WF_NAME_OVERRIDE: '{{ .WF_NAME_OVERRIDE | default "" }}'
    cmds:
      - task: watcher:config
        vars:
          VERSION: "{{ .VERSION }}"
          VALUES_FILE: "{{ .VALUES_FILE }}"
          WF_NAME_OVERRIDE: "{{ .WF_NAME_OVERRIDE }}"
      - task: watcher:deploy
        vars:
          VERSION: "{{ .VERSION }}"

  watcher:clean:
    desc: "Clean watcher workflow artifacts"

    vars:
      VERSION: '{{ .VERSION | default "v1" }}'
    cmds:
      - |
        cd {{ .VERSION }}/watcher && \
        rm -f binary.wasm.br.b64 binary.wasm.br config.yaml workflow.yaml .bin_url .cfg_url cre.yaml upload.log test.state.yaml && \
        rm -rf wasm/

  watcher:check:cre-api-key:
    desc: "Check if CRE_API_KEY environment variable is set"
    internal: true

    cmds:
      - |
        if [ -z "${CRE_API_KEY:-}" ]; then
          echo "⚠️  WARNING: CRE_API_KEY environment variable is not set"
          echo "   Workflow deployment requires CRE_API_KEY (or 'cre login') to authenticate with CRE."
          exit 1
        fi

  watcher:check:cre-eth-private-key:
    desc: "Check if CRE_ETH_PRIVATE_KEY environment variable is set"
    internal: true

    cmds:
      - |
        if [ -z "${CRE_ETH_PRIVATE_KEY:-}" ]; then
          echo "❌ CRE_ETH_PRIVATE_KEY environment variable is not set"
          exit 1
        fi

  watcher:account:link-key:
    desc: "Link wallet address to CRE account"

    deps: [watcher:check:cre-api-key, watcher:check:cre-eth-private-key]
    vars:
      CRE_TARGET: '{{ .CRE_TARGET | default "staging" }}'
      OWNER_LABEL: '{{ .OWNER_LABEL | default "crec-sdk-ext-dta" }}'
    cmds:
      - cre account link-key --target {{ .CRE_TARGET }} --owner-label "{{ .OWNER_LABEL }}"

  # -------------------------------------------------------------
  # ---------------- Mock Server Tasks --------------------------
  # -------------------------------------------------------------
  # Mock server for local workflow simulation/testing

  mock:start:
    desc: "Start mock server for workflow testing"

    cmds:
      - |
        if docker ps --filter "name=mock-server" --filter "status=running" --no-trunc 2>/dev/null | grep -q 'mock-server'; then
          echo "ℹ️  Mock server is already running"
        else
          docker rm -f mock-server 2>/dev/null || true
          docker-compose -f mocks/docker-compose.mock.yml up -d
        fi

  mock:stop:
    desc: "Stop mock server"

    cmds:
      - docker-compose -f mocks/docker-compose.mock.yml down

  mock:logs:
    desc: "View mock server logs"

    cmds:
      - docker-compose -f mocks/docker-compose.mock.yml logs -f

  mock:restart:
    desc: "Restart mock server"

    cmds:
      - task: mock:stop
      - task: mock:start
